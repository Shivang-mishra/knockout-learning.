<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>knockout Login App</title>
    <script src="./knockout-3.5.3.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Login Section -->
        <div class="login-card" data-bind="visible: !isLoggedIn()">
            <h1>Welcome Back User</h1>
            <p>Please login to your account</p>
            <form data-bind="submit: login">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" placeholder="Enter your name" data-bind="value: username" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" data-bind="value: password" required>
                </div>
                <p class="error" data-bind="visible: errorMessage, text: errorMessage"></p>

                <button type="submit">Login</button>
            </form>
        </div>
        <div class="dashboard-card" data-bind="visible: isLoggedIn">
            <h1>Dashboard</h1>
            <h2>
                Hello, <span data-bind="text: loggedInUser"></span>!
            </h2>
            <p>You have successfully logged in.</p>

            <button class="logout-btn" data-bind="click: logout">
                Logout
            </button>

        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
